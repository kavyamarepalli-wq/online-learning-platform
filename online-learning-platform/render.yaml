# Render Blueprint for the backend API. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: learnsphere-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend --workers 2 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: TRUSTED_PROXIES
        value: "1"
      - key: STORAGE_BACKEND
        value: s3
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
